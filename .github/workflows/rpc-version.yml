name: rpc-version

# RPC-surface versioning gate (NFR-IC-04): a breaking change to the control-plane
# operator/gateway RPC wire surface requires a MAJOR version bump + a deprecation
# header. This job runs the committed scripts/rpc-version-check.sh, which diffs the
# current wire surface against the PR merge base with buf (proto) / oasdiff (OpenAPI).
#
# The operator-REST / proto WIRE schemas are a deferred follow-up (#205): the v1
# control plane ships its wire surface as the FROZEN JSON-Schema contracts under
# contracts/, which buf/oasdiff cannot breaking-diff. Until the proto/OpenAPI
# schemas land, the check SKIPS with a notice (exit 0) so the gate is wired and green
# from commit 1, then enforces automatically the moment a diffable surface is
# committed. See docs/rpc-versioning.md for the full policy and the migration TODO.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rpc-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rpc-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge base is fetchable for the breaking-change diff.
          fetch-depth: 0
      - name: resolve the base ref for the surface diff
        id: base
        # Pass the event name and base ref through the environment rather than
        # interpolating ${{ }} directly into the run: script — github.base_ref is
        # the (attacker-controllable on a fork PR) base branch name, and splicing
        # it into shell text is a run-shell-injection risk. As env vars the values
        # are data the shell reads, never script the shell parses.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="HEAD^"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "rpc-version base ref: $base"
      # Both CLIs are installed unconditionally. The gate FAILS CLOSED when a
      # surface is present and its tool is missing, so a job that skipped the
      # install would turn a detected surface into an infrastructure error
      # instead of a verdict.
      - uses: bufbuild/buf-action@c231a1aa9281e5db706c970f468f0744a37561fd # v1.2.0
        with:
          setup_only: true
      # The published release binary, verified against the release's own
      # checksums file, rather than `go install`: the module path resolves
      # through the checksum database, so a proxy hiccup would fail this job for
      # a reason that has nothing to do with the RPC surface.
      - name: install oasdiff
        env:
          OASDIFF_VERSION: 1.28.0
        run: |
          set -euo pipefail
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          asset="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          grep " $asset\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" oasdiff
          sudo install -m 0755 oasdiff /usr/local/bin/oasdiff
          rm -f "$asset" checksums.txt oasdiff
          oasdiff --version
      # The probe runs BEFORE the gate and plants the breaking change the gate
      # claims to catch. This gate reported a confident green for its whole life
      # while silently skipping — it probed paths the contracts do not live at —
      # so "exit 0" is not evidence and the probe is what makes it evidence.
      - name: rpc-version red-probe (gate-enforces proof)
        run: bash scripts/rpc-version-redprobe.sh
      - name: rpc-surface breaking-change gate (buf/oasdiff)
        run: bash scripts/rpc-version-check.sh "${{ steps.base.outputs.ref }}"
