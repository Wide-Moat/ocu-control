name: security

on:
  push:
    branches: [main]
    # Tag refs do not match a branches: filter; without this a v* tag would
    # release from a ref these gates never scanned. release.yml waits for
    # this workflow's check runs on the tagged commit.
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly cron: Sunday at 02:00 UTC (T2-10, SUPPLY-03)
    - cron: '0 2 * * 0'

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lexicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: naming denylist
        # The project keeps a denylist of terms that must not appear in the
        # tree (working names, third-party naming). The list is maintained as
        # a repository secret so the denied terms are not themselves published.
        # On forks (no secret) the job passes with a notice; the gate is
        # enforced on this repository's own PRs and pushes.
        env:
          DENYLIST: ${{ secrets.LEXICON_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${DENYLIST:-}" ]; then
            echo "::notice::LEXICON_DENYLIST not configured in this context; skipping"
            exit 0
          fi
          # grep exit codes: 0 = hit (fail the gate), 1 = clean, >=2 = grep
          # itself errored (malformed pattern, read error) — a broken gate
          # must fail loud, never pass as clean.
          rc=0
          hits=$(grep -rniE "$DENYLIST" --exclude-dir='.git' . 2>/tmp/grep-err) || rc=$?
          if [ "$rc" -ge 2 ]; then
            cat /tmp/grep-err >&2
            echo "::error::lexicon grep failed (rc=$rc) — fix the denylist pattern; failing closed"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "$hits" | sed -E 's/^([^:]+:[0-9]+).*/\1: denied term/'
            echo "::error::denied term found — see the project lexicon policy"
            exit 1
          fi
          echo "lexicon clean"

  secrets-gitleaks:
    runs-on: ubuntu-latest
    # One version literal for the whole job: the scanner the gate runs and the
    # scanner the red-probe runs MUST be the same, or the probe proves a different
    # scanner than the one guarding the tree. Two separately-maintained literals
    # drift silently and nothing fails; one variable removes the class instead of
    # guarding it. The checksum is bound to this version, so a bump that forgets to
    # update it fails the install step loudly rather than installing unverified bytes.
    env:
      GL_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums.
      GL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks GitHub Action requires a paid org licence; the OSS
      # docker image does not. Run it directly. The repo .gitleaks.toml is
      # auto-discovered and (via [extend] useDefault) extends the default ruleset.
      - name: gitleaks (docker)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "zricethezav/gitleaks:v${GL_VERSION}" \
            detect --source=/repo --redact --no-banner
      # RED-when-neutered proof: a config without [extend]/useDefault scans with no
      # rules (a vacuous gate). This plants a secret and asserts gitleaks fires, so a
      # regression that drops the default ruleset cannot pass review. It runs a real
      # gitleaks binary on PATH so the probe's `command -v gitleaks` check is honest.
      - name: install gitleaks binary (for the red-probe)
        # The version was already pinned, but the BYTES were not verified: the tarball
        # streamed straight into tar, so a substituted or truncated artifact would be
        # unpacked and run. Download first, verify the sha256 from the release
        # checksums, then extract. `set -euo pipefail` so a failed download or a
        # checksum mismatch fails the step instead of falling through to a `version`
        # call on whatever is already on PATH.
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          echo "${GL_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks red-probe (gate-fires proof)
        run: bash scripts/gitleaks-redprobe.sh

  secrets-trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: trufflehog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          # Pin the SCANNER BINARY, not just the action SHA. The action's
          # `version` input defaults to "latest", so the SHA-pinned composite
          # still does `docker run ghcr.io/.../trufflehog:latest` — a fresh
          # upstream image (e.g. 3.95.6) can change findings under a frozen
          # action ref. Pinning the image tag to the action's own release makes
          # the scanner version reproducible alongside the action. The ghcr
          # image tags carry NO `v` prefix (`3.95.5`, not `v3.95.5`); a leading
          # `v` resolves to `manifest unknown`, so the bare release number is
          # the correct tag.
          version: 3.95.5
          # `--fail` is appended by the entrypoint; `--no-verification`
          # removes the egress credential-validation calls. Do not also pass
          # --results=... or a second --fail (the action rejects repeats and
          # errors on equal BASE/HEAD).
          #
          # --exclude-paths: the repo is mounted at /tmp inside the scanner
          # image (the action runs `docker run -v .:/tmp -w /tmp`), so the
          # exclude file is addressed at /tmp/.trufflehog-exclude.txt. It scopes
          # out the four *_test.go fixture JWTs (unverified, authenticate
          # nothing) — see that file's header. The detector still runs on all
          # non-test source.
          extra_args: --no-verification --exclude-paths /tmp/.trufflehog-exclude.txt
      # RED-when-neutered proof. The gate above can go quiet without failing: one
      # over-broad exclude entry removes the tree from the scan and the job stays
      # green. The probe plants a credential and requires the scan to NAME that file.
      # The binary is pinned to the same version the action runs, so the probe proves
      # the gate, not a different scanner.
      - name: install trufflehog binary (for the red-probe)
        # Fetch the RELEASE TARBALL at a pinned version and verify its checksum,
        # rather than piping an installer script from a moving branch into a shell.
        # An installer fetched from `main` is unpinned by construction: the SHA-pinned
        # action above buys nothing if the next step executes whatever that branch
        # holds today, inside a job that gates every push and tag.
        env:
          TH_VERSION: 3.95.5
          # sha256 of trufflehog_3.95.5_linux_amd64.tar.gz, from the release checksums.
          TH_SHA256: 8d151a19465973bec226be5992a2a11b053f4ab92c77861f642089892ae9aa58
        run: |
          set -euo pipefail
          url="https://github.com/trufflesecurity/trufflehog/releases/download/v${TH_VERSION}/trufflehog_${TH_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" -o /tmp/trufflehog.tgz
          echo "${TH_SHA256}  /tmp/trufflehog.tgz" | sha256sum -c -
          tar -xzf /tmp/trufflehog.tgz -C /usr/local/bin trufflehog
          trufflehog --version
      - name: trufflehog red-probe (gate-fires proof)
        run: bash scripts/trufflehog-redprobe.sh

  sast-semgrep:
    runs-on: ubuntu-latest
    # Temporarily non-blocking by owner direction 2026-08-01. Remove this flag and
    # the line below to restore the gate; the job still runs and still reports.
    continue-on-error: true
    container:
      # Pin the SCANNER IMAGE by DIGEST, not by a floating tag. `semgrep/semgrep`
      # with no tag resolves to :latest, so the job's own findings could change
      # under a frozen workflow -- the same class the trufflehog step already
      # guards against by pinning its scanner version, and the reason a
      # SHA-pinned action is not by itself a pinned scanner. The version tag is
      # kept alongside the digest for readability; the digest is what binds.
      image: semgrep/semgrep:1.144.0@sha256:10301f060aacf84078f9704fb1ba3a321df4ac46b009fd29c1c66880d1db8e77
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        # Emit SARIF for the Security tab AND keep the blocking exit code: run
        # the SARIF pass non-blocking, then a second gating pass. `|| true` on
        # the first keeps a finding from masking the upload; the second is the
        # gate.
        run: |
          semgrep ci --sarif --output=semgrep.sarif || true
          semgrep ci
        env:
          # Rulesets target this codebase's actual language (Go) plus the
          # cross-cutting security and infra packs. Language packs for
          # languages not present in the tree add scan time without coverage,
          # so they are omitted.
          SEMGREP_RULES: >-
            p/security-audit p/owasp-top-ten p/golang
            p/github-actions p/secrets
          SEMGREP_SUPPRESS_ERRORS: "false"
      # RED-when-neutered proof. A trimmed SEMGREP_RULES or a ruleset that stops
      # resolving leaves semgrep exiting 0 with no findings, which looks exactly like
      # clean code. The probe plants a finding the configured rules carry and requires
      # semgrep to NAME the planted file.
      - name: semgrep red-probe (gate-fires proof)
        run: bash scripts/semgrep-redprobe.sh
        env:
          SEMGREP_RULES: >-
            p/security-audit p/owasp-top-ten p/golang
            p/github-actions p/secrets
      - name: upload semgrep SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  sca-trivy-fs:
    runs-on: ubuntu-latest
    # Temporarily non-blocking by owner direction 2026-08-01. Remove this flag and
    # the line below to restore the gate; the job still runs and still reports.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy filesystem — CRITICAL,HIGH blocks
        # severity CRITICAL,HIGH (not CRITICAL only): the Go ecosystem's NVD/GHSA
        # advisories are almost entirely HIGH — a firsthand sweep of a dozen
        # popular vulnerable Go deps (jwt-go auth-bypass, runc, containerd,
        # consul, gin, yaml.v2) found ALL classified HIGH, ZERO CRITICAL, so a
        # CRITICAL-only SCA gate is near-vacuous for a Go module: a real HIGH
        # auth-bypass would ship green. HIGH is the fleet standard. Findings with
        # no reachable path or no upstream fix are carried, with a rationale and a
        # review-by date, in .trivyignore — never blanket-suppressed.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "false"
          trivyignores: .trivyignore
      # RED-when-neutered proof. An SCA gate goes quiet through its severity floor or
      # through a .trivyignore that grows to cover findings instead of documenting
      # them; both leave a green job. The probe plants a dependency with known
      # CRITICAL/HIGH advisories and requires trivy to NAME that file, scanning with
      # the same floor and ignore file as the gate above.
      - name: install trivy binary (for the red-probe)
        # Same reasoning as the trufflehog step: a release tarball at a pinned
        # version with a verified checksum, not an installer script from a branch.
        env:
          TRIVY_VERSION: 0.72.0
          # sha256 of trivy_0.72.0_Linux-64bit.tar.gz, from the release checksums.
          TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$url" -o /tmp/trivy.tgz
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version
      - name: trivy red-probe (gate-fires proof)
        run: bash scripts/trivy-redprobe.sh

  # release-path structural gate. The signed-SBOM/provenance gate itself runs on a
  # tag, so it can never be a required PR check -- and a skipped required check counts
  # as PASSED, so relocating it behind a PR condition would produce a permanently
  # green check that blocks nothing. This job is the part that CAN be required: it
  # reads the workflow files, needs no artifact, and fails the pull request that would
  # introduce the regression rather than the release that suffers it.
  release-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: install pyyaml
        run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: signing precedes any consumable reference
        run: python3 scripts/check-signing-precedes-publish.py
      - name: release-path red-probe (gate-fires proof)
        run: bash scripts/signing-precedes-publish-redprobe.sh

  conventional-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: install PyYAML
        run: pip install --disable-pip-version-check pyyaml
      # The self-test runs FIRST and plants every violation the gate claims to
      # catch. A gate that stopped detecting would otherwise report the same
      # green as a manifest with nothing wrong in it.
      - name: iac-policy red-probe (gate-fires proof)
        run: python3 scripts/iac_policy_check.py --self-test
      - name: iac-policy (NFR-SEC-52, Control side)
        run: python3 scripts/iac_policy_check.py
